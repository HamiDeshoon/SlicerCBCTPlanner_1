[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slicer-cbct-planner"
dynamic = ["version"]
description = "3D Slicer Dental CBCT Planning Extension (Curved Planar Reformat, Multi-Slice Lightbox, Canal & Implant Planning)"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools]
py-modules = ["CBCTPlanner", "cli_batch"]
package-dir = {"" = "CBCTPlanner"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["CBCTPlanner"]
include = ["CBCTPlannerLib*"]

[tool.setuptools.dynamic]
version = {file = "CBCTPlanner/Resources/VERSION"}

[tool.ruff]
# Pinned so `ruff format --check` is deterministic across local runs and CI.
# Must match the version installed in .github/workflows/ci.yml.
required-version = "==0.17.6"
target-version = "py39"
line-length = 110
include = ["CBCTPlanner/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
