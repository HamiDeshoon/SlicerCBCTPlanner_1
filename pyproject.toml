[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slicer-cbct-planner"
version = "2.0.0"
description = "3D Slicer Dental CBCT Planning Extension (Curved Planar Reformat, Multi-Slice Lightbox, Canal & Implant Planning)"
readme = "README.md"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 110
include = ["CBCTPlanner/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
